<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Smart Expense Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand"><div class="mark">৳</div><span>SpendTrack</span></div>
    <p class="auth-sub">Welcome back. Log in to see where your money's going.</p>
    <div class="auth-error" id="errorBox"></div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
  if (Auth.getToken()) window.location.href = 'index.html';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      const data = await API.post('/auth/login', { email, password }, false);
      Auth.setSession(data.token, data.user);
      window.location.href = 'index.html';
    } catch (err) {
      errorBox.textContent = err.message || 'Login failed';
      errorBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
